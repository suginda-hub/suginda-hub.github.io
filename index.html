<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Web Terintegrasi</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; text-align: center; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Koneksi GitHub Pages ke Google Apps Script</h1>
    <p>Klik tombol di bawah untuk menguji koneksi data ke Google Script Anda.</p>
    
    <button onclick="panggilScript()">Tes Koneksi Data</button>

    <script>
        // URL Web App Google Script Anda
        const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbwpZU3DxVtlM9ly7nZ7OMV05y-CSeqtYwiavM8MKvH-Rp_PKCvvZjEWr4Syej__AEk/exec";

        function panggilScript() {
            fetch(URL_WEB_APP)
            .then(res => res.json())
            .then(data => {
                alert("Berhasil terhubung! Respons data: " + JSON.stringify(data));
            })
            .catch(err => {
                alert("Error! Periksa kembali apakah pengaturan Deployment di Google Script sudah diset ke 'Anyone'.");
                console.error(err);
            });
        }
    </script>
</body>
</html>
